[project]
name = "agent-browser"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "cyclopts>=4.22.5",
    "mcp>=2.0.0",
    "patchright>=1.62.1",
    "pydantic>=2.13.4",
    "pyicu>=2.16.2",
    "trafilatura>=2.2.0",
]

[project.scripts]
agent-browser = "ab.cli:main"
agent-browser-mcp = "ab.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ab"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["trafilatura.*", "patchright.*", "icu.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# The project is not installed into the dev shell's interpreter -- that env
# carries the dependencies, not `ab` itself -- so the tests import it from the
# working tree.
pythonpath = ["."]
testpaths = ["tests"]
