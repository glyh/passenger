[project]
name = "agent-browser"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "cyclopts>=4.23.1",
    "patchright>=1.62.1",
    "pydantic>=2.13.4",
    "trafilatura>=2.2.0",
]

[project.scripts]
agent-browser = "ab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ab"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["trafilatura.*", "patchright.*"]
ignore_missing_imports = true
