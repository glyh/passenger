[project]
name = "agent-browser"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "patchright>=1.62.1",
    "trafilatura>=2.2.0",
]

[project.scripts]
agent-browser = "ab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ab"]
