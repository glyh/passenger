name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npm run compile

      - name: Rename binary
        run: mv passenger passenger-${{ matrix.target }}

      - uses: softprops/action-gh-release@v2
        with:
          files: passenger-${{ matrix.target }}
